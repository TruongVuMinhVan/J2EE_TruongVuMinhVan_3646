spring.application.name=TruongVuMinhVan_3646

# Cấu hình kết nối MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/j2ee_bookdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# Để Hibernate tự chọn dialect phù hợp với MySQL (tránh lỗi MySQL8Dialect với Hibernate 7)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Tắt H2 console vì dùng MySQL
spring.h2.console.enabled=false

# Tài khoản đăng nhập cố định (Spring Security default user)
spring.security.user.name=user
spring.security.user.password=123456