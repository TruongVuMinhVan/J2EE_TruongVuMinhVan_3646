<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HUTECH Bookstore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link th:fragment="link-css" rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
    <!-- Split CSS Files -->
    <link th:fragment="custom-css" rel="stylesheet" th:href="@{/css/base.css}">
    <link th:fragment="custom-css" rel="stylesheet" th:href="@{/css/components.css}">
    <link th:fragment="custom-css" rel="stylesheet" th:href="@{/css/books.css}">
    <link th:fragment="custom-css" rel="stylesheet" th:href="@{/css/payment.css}">
    <th:block layout:fragment="css"></th:block>
</head>

<body class="d-flex flex-column h-100">
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">HUTECH</a>
                <span sec:authorize="hasAuthority('ADMIN')" class="fw-bold text-danger ms-2">ADMIN</span>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/">Home</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN','USER')">
                            <a class="nav-link" href="/books">
                                DS sách
                            </a>
                        </li>
                        <!-- <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN')">
                            <a class="nav-link" href="/books/add">
                                Thêm sách
                            </a>
                        </li> -->
                        <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN','USER')">
                            <a class="nav-link" href="/cart">
                                Giỏ hàng
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAuthority('USER')">
                            <a class="nav-link" href="/orders">
                                Đơn hàng
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAuthority('ADMIN')">
                            <a class="nav-link" href="/orders">
                                Lịch sử giao dịch
                            </a>
                        </li>
                        <li sec:authorize="isAuthenticated()">
                            <form th:action="@{/logout}" method="post">
                                <button class="btn btn-outline-danger" type="submit">Logout</button>
                            </form>
                        </li>
                        <li sec:authorize="!isAuthenticated()">
                            <a class="btn btn-outline-primary" href="/login">
                                Login
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <div class="container">
        <div th:fragment="content"></div>
    </div>
    <footer th:fragment="footer" class="footer mt-auto py-3 bg-light">
        <div class="container text-center">Copyright &copy;
            <span>2026</span>
            <a href="https://www.hutech.edu.vn/">HUTECH Education</a>
        </div>
        <script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
        <script th:src="@{/bootstrap/js/jquery-3.7.0.min.js}"></script>
    </footer>
</body>

</html>
