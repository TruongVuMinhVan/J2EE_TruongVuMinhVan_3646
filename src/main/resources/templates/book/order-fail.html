<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Thanh toán thất bại</title>
    <th:block layout:fragment="css">
        <style>
            /* 1. Nền tổng thể */
            body {
                background-color: #f4f6f8;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            }

            /* Layout Centering */
            .payment-layout {
                min-height: 85vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem 0;
            }

            /* 2. Card chính */
            .payment-card {
                border: none;
                border-radius: 24px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
                background: #fff;
                overflow: hidden;
                position: relative;
                width: 100%;
            }

            /* 3. Header: Gradient Đỏ cảnh báo */
            .failed-header {
                background: linear-gradient(135deg, #b91c1c 0%, #ef4444 100%);
                /* Đỏ đậm sang đỏ tươi */
                padding: 40px 20px;
                text-align: center;
                color: white;
                position: relative;
            }

            /* Hiệu ứng đường cong chân header */
            .failed-header::after {
                content: '';
                position: absolute;
                bottom: -20px;
                left: 0;
                width: 100%;
                height: 40px;
                background: white;
                border-radius: 50% 50% 0 0 / 100% 100% 0 0;
                transform: scaleX(1.5);
            }

            /* 4. Animation Dấu Chéo (Cross) */
            .cross-wrapper {
                width: 80px;
                height: 80px;
                background: rgba(255, 255, 255, 0.2);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 20px;
                backdrop-filter: blur(4px);
                position: relative;
            }

            .cross-icon {
                width: 40px;
                height: 40px;
                position: relative;
            }

            .cross-icon::before,
            .cross-icon::after {
                content: '';
                position: absolute;
                width: 4px;
                height: 40px;
                background-color: white;
                border-radius: 4px;
                top: 0;
                left: 18px;
                /* Căn giữa */
                opacity: 0;
            }

            .cross-icon::before {
                transform: rotate(45deg);
                animation: cross-draw-1 0.4s ease forwards 0.2s;
            }

            .cross-icon::after {
                transform: rotate(-45deg);
                animation: cross-draw-2 0.4s ease forwards 0.4s;
                /* Chạy sau cái kia 1 chút */
            }

            @keyframes cross-draw-1 {
                from {
                    height: 0;
                    opacity: 0;
                }

                to {
                    height: 40px;
                    opacity: 1;
                }
            }

            @keyframes cross-draw-2 {
                from {
                    height: 0;
                    opacity: 0;
                }

                to {
                    height: 40px;
                    opacity: 1;
                }
            }

            /* 5. Box chi tiết lỗi */
            .error-box {
                background-color: #fef2f2;
                /* Màu đỏ cực nhạt */
                border: 1px dashed #fecaca;
                /* Viền đỏ nhạt nét đứt */
                border-radius: 16px;
                padding: 24px;
                margin-top: 20px;
            }

            .error-label {
                color: #991b1b;
                font-size: 0.9rem;
                font-weight: 500;
            }

            .error-value {
                color: #7f1d1d;
                font-weight: 600;
                font-size: 0.95rem;
                text-align: right;
            }

            /* 6. Nút bấm */
            .btn-retry {
                background-color: #dc2626;
                color: white;
                border-radius: 50px;
                padding: 12px 30px;
                font-weight: 600;
                transition: all 0.3s ease;
                border: none;
                box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
            }

            .btn-retry:hover {
                background-color: #b91c1c;
                transform: translateY(-2px);
                color: white;
                box-shadow: 0 8px 16px rgba(220, 38, 38, 0.3);
            }

            .btn-home-outline {
                background-color: transparent;
                color: #64748b;
                border: 2px solid #e2e8f0;
                border-radius: 50px;
                padding: 10px 30px;
                font-weight: 600;
                transition: all 0.3s ease;
            }

            .btn-home-outline:hover {
                background-color: #f1f5f9;
                color: #0f172a;
                border-color: #cbd5e1;
            }
        </style>
    </th:block>
</head>

<body>
    <section layout:fragment="content" class="container payment-layout">
        <div class="card payment-card" style="max-width: 500px;">

            <div class="failed-header">
                <div class="cross-wrapper">
                    <div class="cross-icon"></div>
                </div>
                <h3 class="fw-bold mb-1">Giao Dịch Thất Bại</h3>
                <p class="mb-0 opacity-75" style="font-size: 0.9rem;">Rất tiếc, đã có lỗi xảy ra</p>
            </div>

            <div class="card-body p-4 pt-5">

                <div class="text-center mb-4">
                    <p class="text-muted small px-3">
                        Giao dịch đã bị hủy hoặc bị từ chối bởi ngân hàng phát hành thẻ.
                    </p>
                </div>

                <div class="error-box">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="error-label">Mã tham chiếu</span>
                        <span class="error-value"
                            th:text="${transactionId != null ? transactionId : '---'}">TRX-FAIL-001</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="error-label">Thời gian</span>
                        <span class="error-value" th:text="${paymentTime}">12:30 25/08/2024</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <span class="error-label">Số tiền</span>
                        <span class="error-value"
                            th:text="${#numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                            500.000 đ
                        </span>
                    </div>
                </div>

                <div class="alert alert-light border-0 text-center mt-3 text-muted" style="font-size: 0.85rem;">
                    <i class="bi bi-info-circle me-1"></i>
                    Vui lòng kiểm tra số dư hoặc thử lại thẻ khác.
                </div>

                <div class="d-flex justify-content-center gap-3 mt-4 mb-2">
                    <a href="/cart" class="btn btn-retry text-decoration-none">
                        Thử lại ngay
                    </a>
                    <a href="/" class="btn btn-home-outline text-decoration-none">
                        Về trang chủ
                    </a>
                </div>

            </div>
        </div>
    </section>
</body>

</html>
