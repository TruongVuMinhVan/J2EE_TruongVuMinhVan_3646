<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store</title>
    <th:block th:replace="~{layout::link-css}"></th:block>
    <th:block th:replace="~{layout::custom-css}"></th:block>
</head>

<body>
    <th:block th:replace="~{layout::header}"></th:block>

    <div class="container py-4">
        <!-- Header with Search -->
        <div class="row mb-4">
            <div class="col-md-6">
                <h2 class="page-title">📚 Book Store</h2>
            </div>
            <div class="col-md-6">
                <form class="d-flex" th:action="@{/books/search}" method="get">
                    <input class="form-control me-2" type="search" placeholder="Tìm kiếm sách..." aria-label="Search"
                        name="keyword">
                    <button class="btn btn-primary" type="submit">
                        <i class="fas fa-search"></i> Tìm
                    </button>
                </form>
            </div>
        </div>

        <!-- Admin Buttons -->
        <div sec:authorize="hasAnyAuthority('ADMIN')" class="mb-4 d-flex gap-2">
            <a th:href="@{/books/add}" class="btn btn-success">
                <i class="fas fa-plus"></i> Thêm sách mới
            </a>
            <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal"
                data-bs-target="#categoryModal">
                📂 Danh mục
            </button>
        </div>

        <!-- Book Cards Grid -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4">
            <div class="col" th:each="book : ${books}">
                <div class="book-card">
                    <!-- Book Image -->
                    <div class="book-card-image">
                        <img th:if="${book.image != null and !#strings.isEmpty(book.image)}" 
                             th:src="@{'/images/books/' + ${book.image}}"
                             alt="Book Cover">
                        <div th:unless="${book.image != null and !#strings.isEmpty(book.image)}" class="book-placeholder">
                            <svg class="book-placeholder-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path
                                    d="M6,2H18A2,2 0 0,1 20,4V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V4A2,2 0 0,1 6,2M6,4V20H18V4H6Z"
                                    opacity="0.5" />
                                <path
                                    d="M11,18H13V16H11V18M12,6A4,4 0 0,0 8,10H10A2,2 0 0,1 12,8A2,2 0 0,1 14,10C14,12 11,11.75 11,15H13C13,12.75 16,12.5 16,10A4,4 0 0,0 12,6Z" />
                            </svg>
                        </div>
                    </div>

                    <!-- Book Info -->
                    <div class="book-card-body">
                        <h5 class="book-title" th:text="${book.title}">Book Title</h5>
                        <p class="book-author" th:text="${book.author}">Author Name</p>
                        <p class="book-category"
                            th:text="${book.category != null ? book.category.name : 'Chưa phân loại'}">Category</p>

                        <!-- Price -->
                        <div class="book-price">
                            <span class="price-current"
                                th:text="${#numbers.formatDecimal(book.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">100.000
                                đ</span>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="book-card-footer">
                        <!-- User: Only Buy Button -->
                        <div sec:authorize="hasAnyAuthority('ADMIN','USER')">
                            <form th:action="@{/books/add-to-cart}" method="post" class="w-100">
                                <input type="hidden" name="id" th:value="${book.id}">
                                <input type="hidden" name="name" th:value="${book.title}">
                                <input type="hidden" name="price" th:value="${book.price}">
                                <button type="submit" class="btn btn-buy w-100">
                                    🛒 Mua ngay
                                </button>
                            </form>
                        </div>

                        <!-- Admin: Edit/Delete Buttons -->
                        <div sec:authorize="hasAnyAuthority('ADMIN')" class="admin-actions mt-2">
                            <a class="btn btn-edit btn-sm" th:href="@{/books/edit/{id}(id=${book.id})}">
                                ✏️ Sửa
                            </a>
                            <a class="btn btn-delete btn-sm" th:href="@{/books/delete/{id}(id=${book.id})}"
                                onclick="return confirm('Bạn có chắc muốn xóa sách này?')">
                                🗑️ Xóa
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(books)}" class="text-center py-5">
            <h4>Không có sách nào</h4>
            <p class="text-muted">Hãy thêm sách mới để bắt đầu!</p>
        </div>

        <!-- Pagination -->
        <nav aria-label="Page navigation" th:if="${totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{/books(pageNo=${i})}" th:text="${i + 1}">1</a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Category Management Modal -->
    <div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="categoryModalLabel">📂 Quản lý danh mục</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Add Category Form -->
                    <form th:action="@{/books/category/add}" method="post" class="mb-4">
                        <div class="input-group">
                            <input type="text" class="form-control" name="name" placeholder="Nhập tên danh mục mới..."
                                required>
                            <button type="submit" class="btn btn-success">
                                ➕ Thêm
                            </button>
                        </div>
                    </form>

                    <hr>

                    <!-- Category List -->
                    <h6 class="mb-3">Danh sách danh mục:</h6>
                    <div class="list-group" th:if="${categories != null && !#lists.isEmpty(categories)}">
                        <div th:each="cat : ${categories}" class="list-group-item">
                            <form th:action="@{/books/category/edit/{id}(id=${cat.id})}" method="post"
                                class="d-flex align-items-center gap-2">
                                <input type="text" class="form-control form-control-sm" name="name"
                                    th:value="${cat.name}" required style="max-width: 300px;">
                                <button type="submit" class="btn btn-sm btn-outline-primary">
                                    ✏️ Lưu
                                </button>
                                <a th:href="@{/books/category/delete/{id}(id=${cat.id})}"
                                    class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Bạn có chắc muốn xóa danh mục này?')">
                                    🗑️ Xóa
                                </a>
                            </form>
                        </div>
                    </div>

                    <div th:if="${categories == null || #lists.isEmpty(categories)}"
                        class="text-center text-muted py-3">
                        Không có danh mục nào. Hãy thêm danh mục mới!
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{layout::footer}"></th:block>
</body>

</html>
