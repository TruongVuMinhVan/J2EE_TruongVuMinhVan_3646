<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Thanh toán thành công</title>
    <th:block layout:fragment="css">
        <style>
            /* 1. Nền tổng thể: Màu xám nhẹ chuẩn Enterprise */
            body {
                background-color: #f4f6f8;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            }

            /* Layout Centering */
            .payment-layout {
                min-height: 85vh;
                /* Full viewport height minus header/footer approx */
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem 0;
            }

            /* 2. Card chính: Nổi khối, đổ bóng mềm */
            .payment-card {
                border: none;
                border-radius: 24px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
                background: #fff;
                overflow: hidden;
                position: relative;
                width: 100%;
            }

            /* 3. Header: Gradient xanh hiện đại */
            .payment-header {
                background: linear-gradient(135deg, #059669 0%, #10b981 100%);
                /* Màu xanh Emerald */
                padding: 40px 20px;
                text-align: center;
                color: white;
                position: relative;
            }

            /* Hiệu ứng đường cong ngăn cách header và body (Optional) */
            .payment-header::after {
                content: '';
                position: absolute;
                bottom: -20px;
                left: 0;
                width: 100%;
                height: 40px;
                background: white;
                border-radius: 50% 50% 0 0 / 100% 100% 0 0;
                transform: scaleX(1.5);
            }

            /* 4. Animation Dấu tích V (Checkmark) */
            .checkmark-wrapper {
                width: 80px;
                height: 80px;
                background: rgba(255, 255, 255, 0.2);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 20px;
                backdrop-filter: blur(4px);
            }

            .checkmark {
                width: 40px;
                height: 20px;
                border-bottom: 4px solid #fff;
                border-left: 4px solid #fff;
                transform: rotate(-45deg) translate(2px, -2px);
                animation: checkmark-draw 0.8s ease forwards;
                opacity: 0;
            }

            @keyframes checkmark-draw {
                0% {
                    width: 0;
                    height: 0;
                    opacity: 0;
                }

                50% {
                    width: 40px;
                    height: 0;
                    opacity: 1;
                }

                100% {
                    width: 40px;
                    height: 20px;
                    opacity: 1;
                }
            }

            /* 5. Box hóa đơn (Receipt): Giống tờ giấy in ra */
            .receipt-box {
                background-color: #f8fafc;
                border: 1px solid #e2e8f0;
                border-radius: 16px;
                padding: 24px;
                margin-top: 20px;
                position: relative;
            }

            /* Đường kẻ nét đứt giống hóa đơn */
            .receipt-divider {
                border-top: 2px dashed #cbd5e1;
                margin: 16px 0;
            }

            .receipt-label {
                color: #64748b;
                font-size: 0.9rem;
                font-weight: 500;
            }

            .receipt-value {
                color: #1e293b;
                font-weight: 600;
                font-size: 0.95rem;
                text-align: right;
            }

            .total-amount {
                color: #059669;
                /* Xanh tiền tệ */
                font-weight: 800;
                font-size: 1.5rem;
            }

            /* 6. Nút bấm: Bo tròn, Hover hiệu ứng */
            .btn-home {
                background-color: #0f172a;
                /* Màu tối sang trọng */
                color: white;
                border-radius: 50px;
                padding: 12px 40px;
                font-weight: 600;
                transition: all 0.3s ease;
                box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
            }

            .btn-home:hover {
                background-color: #334155;
                transform: translateY(-2px);
                box-shadow: 0 8px 16px rgba(15, 23, 42, 0.3);
                color: #fff;
            }
        </style>
    </th:block>
</head>

<body>
    <section layout:fragment="content" class="container payment-layout">
        <div class="card payment-card" style="max-width: 500px;">

            <div class="payment-header">
                <div class="checkmark-wrapper">
                    <div class="checkmark"></div>
                </div>
                <h3 class="fw-bold mb-1">Thanh Toán Thành Công!</h3>
                <p class="mb-0 opacity-75" style="font-size: 0.9rem;">Cảm ơn quý khách đã tin tưởng</p>
            </div>

            <div class="card-body p-4 pt-5">
                <div class="text-center mb-4">
                    <p class="text-muted small">Giao dịch của bạn đã được xử lý an toàn.</p>
                </div>

                <div class="receipt-box">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="receipt-label">Mã đơn hàng</span>
                        <span class="receipt-value" th:text="${orderId}">ORD-123456</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="receipt-label">Mã tham chiếu</span>
                        <span class="receipt-value" th:text="${transactionId}">TRX-987654</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="receipt-label">Thời gian</span>
                        <span class="receipt-value" th:text="${paymentTime}">12:30 25/08/2024</span>
                    </div>

                    <div class="receipt-divider"></div>

                    <div class="d-flex justify-content-between align-items-center">
                        <span class="receipt-label fw-bold text-dark">Tổng thanh toán</span>
                        <span class="total-amount"
                            th:text="${#numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                            500.000 đ
                        </span>
                    </div>
                </div>

                <div class="text-center mt-4 mb-2">
                    <a href="/" class="btn btn-home text-decoration-none">
                        Về trang chủ
                    </a>
                </div>

                <div class="text-center mt-3">
                    <small class="text-muted" style="font-size: 0.7rem;">Protected by <strong>VNPay
                            Secure</strong></small>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
